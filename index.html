<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCOE</title>
    <style>
        body {
            background-color: #AFCBE3;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
            transition: background-color 0.5s ease; }
        h1 {
            color: #3F3D4A;
            font-size: 40px;
            margin-bottom: 10px; }
        h3 {
            color: #4F4B58;
            font-size: 24px;
            margin-bottom: 30px; }
        button {
            background-color: white;
            color: #4F4B58;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: 0.3s; }
        button:hover {
            background-color: #C5B4D9;
            color: #3F3D4A;
            transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>Welcome to RCOE</h1>
    <h3>FAIKA</h3>

    <button onclick="changeBg()">Change Background</button>
    <script>
        function changeBg() {
            let colors = [
                "#E8AEB7",
                "#AFCBE3",
                "#A8D5BA",
                "#F2D388",
                "#E6A6AB",
                "#C5B4D9",
                "#774936"
            ];
            const bodyele = document.querySelector("body");
            let randomIndex = Math.floor(Math.random() * colors.length);

            bodyele.style.backgroundColor = colors[randomIndex];
        }
        setInterval(function () {
            changeBg();
        }, 5000);
    </script>
</body>
</html>
