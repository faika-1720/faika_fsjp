<!DOCTYPEdoctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333333; }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); }
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.5px; }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
            background-color: #f8fafc;
            color: #1e293b;
            transition: all 0.25s ease; }
        input:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        input::placeholder {
            color: #94a3b8; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); }
        button:hover {
            background-color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35); }
        button:active {
            transform: translateY(0); }
        #correct, #incorrect {
            margin-top: 24px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease forwards; }
        #correct {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;}
        #incorrect {
            background-color: #fef2f2;
             border: 1px solid #fecaca; }
        #correct h3, #incorrect h3 {
            font-size: 14px;
            font-weight: 500;}
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>Email Validation</h2>
        <p class="subtitle">Enter your email address below to verify its format</p>
        <input type="text" id="email" placeholder="name@example.com">
        <button onclick="validateEmail()">Validate Email</button>
        <div id="correct" style="color: #16a34a; display: none;">
            <h3>✓ The email address is valid</h3>
        </div>
        <div id="incorrect" style="color: #dc2626; display: none;">
            <h3>✕ Invalid email address format</h3>
        </div>
    </div>
    <script>
        function validateEmail() {
            const emailId = document.querySelector("#email");
            const correctEle = document.querySelector("#correct");
            const incorrectEle = document.querySelector("#incorrect");
            let email = emailId.value;
            const emailRegex = /^([a-zA-Z0-9_\.\-\+]+)@([a-zA-Z0-9_\.\-]+)\.([a-zA-Z]{2,5})$/;
            if (emailRegex.test(email)) {
                correctEle.style.display = "flex";
                incorrectEle.style.display = "none";
            } else {
                incorrectEle.style.display = "flex";
                correctEle.style.display = "none"; } }
    </script>
</body>
</html>
